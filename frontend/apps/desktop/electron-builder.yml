# electron-builder configuration for the agent-master desktop shell.
#
# IMPORTANT: the shared web build MUST exist before packaging. Run
#   npm run build -w @agent-master/web
# (the `build`/`dist` npm scripts in this package do this for you). Packaging a
# a real macOS .dmg must be built ON macOS; the Windows installer on Windows.
appId: com.agent-master.desktop
productName: Agent Master
copyright: Agent Master

# Pin the Electron version explicitly. In this npm-workspaces repo `electron` is
# hoisted to the root node_modules, so electron-builder (run from this package
# dir) can't resolve it to compute the version, and the package.json range
# ("^31.7.7") is not a fixed version — without this it fails with
# "Cannot compute electron version from installed node modules".
electronVersion: 31.7.7

directories:
  output: release
  buildResources: build-resources

# Files packed into the app.asar (paths are relative to this package dir).
#  - dist-electron/**  : compiled main + preload (see build.mjs)
#  - the sibling web SPA build is copied to <app>/web-dist inside the asar so
#    main.ts can resolve it as join(__dirname, '..', 'web-dist', 'index.html').
files:
  - dist-electron/**/*
  - package.json
  - from: ../web/dist
    to: web-dist
    filter:
      - '**/*'

extraMetadata:
  main: dist-electron/main.js

# The app is a self-contained esbuild bundle (dist-electron) + the web build; it
# has no production or native dependencies. Skip electron-builder's "install
# production dependencies / rebuild" step — in this npm-workspaces monorepo it
# prunes the hoisted root node_modules to production-only, deleting dev deps
# (including the 7zip-bin that electron-builder itself then needs), which failed
# packaging with: ENOENT chmod node_modules/7zip-bin/<platform>/7za.
npmRebuild: false

# Give the macOS bundle a real ad-hoc signature before the .dmg is built. Without
# this the shipped app carries only the linker's per-binary signature, which does
# not cover the bundle and fails `codesign --verify` — and a quarantined download
# whose signature fails validation is reported as malware and moved to the Trash,
# not merely as coming from an unidentified developer. See the hook for details.
# The leading ./ matters: a bare relative path is first resolved as a module id,
# which logs "Cannot find module" before electron-builder falls back to resolving
# it against this file. It happens to work, but relying on that fallback is
# fragile and the error reads like a failure.
afterPack: ./scripts/adhoc-sign.cjs

mac:
  category: public.app-category.developer-tools
  # No Apple Developer cert in CI, so this build is not notarized. The afterPack
  # hook above ad-hoc signs the bundle so its signature at least validates; users
  # still clear the download quarantine once
  # (`/usr/bin/xattr -dr com.apple.quarantine`, see the README).
  artifactName: Agent-Master-Desktop-${version}-macOS-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  # Deep-link protocol registration for agentmaster:// on macOS.
  extendInfo:
    CFBundleURLTypes:
      - CFBundleURLName: com.agent-master.desktop.pair
        CFBundleURLSchemes:
          - agentmaster

win:
  # Unsigned build (no code-signing cert in CI); SmartScreen will warn once on
  # first launch. agentmaster:// deep links are registered at runtime by
  # main.ts (setAsDefaultProtocolClient writes the per-user registry keys).
  artifactName: Agent-Master-Desktop-${version}-Windows-${arch}.${ext}
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: true
  perMachine: false # per-user install, no admin prompt
